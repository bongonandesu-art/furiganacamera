<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コールセンター住所ルビカメラ</title>
    <!-- 文字の座標を特定するための軽量OCRライブラリ -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        
        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        
        /* メインエリア */
        .view-area { flex: 1; position: relative; width: 100%; background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #preview-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        /* 文字の座標ボタンを重ねる透明なレイヤー */
        #ocr-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; }
        
        /* 認識された文字の上に配置される見えないボタン */
        .kanji-btn { position: absolute; background: rgba(255, 255, 255, 0.01); cursor: pointer; z-index: 10; }
        
        /* Yahoo!から取得したルビを表示するポップアップ */
        .ruby-popup { position: absolute; background: #ffeb3b; color: #000; padding: 5px 10px; border-radius: 4px; font-size: 15px; font-weight: bold; transform: translate(-50%, -130%); z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: none; white-space: nowrap; }

        .guide { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; color: #aaa; background: rgba(0,0,0,0.7); padding: 8px; font-size: 13px; z-index: 10; pointer-events: none; }

        /* 下部ボタンエリア：中央に1uだけ配置 */
        .control-panel { height: 90px; background: #000; display: flex; justify-content: center; align-items: center; border-top: 1px solid #222; z-index: 100; }
        
        .btn-main { border: none; padding: 14px 45px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; min-width: 160px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.2s; }
        .status-shoot { background: #00cc66; color: #fff; }
        .status-retry { background: #ff9900; color: #fff; }
        .btn-main:active { opacity: 0.8; }
        
        #camera-input { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="view-area">
        <img id="preview-img" alt="撮影画像">
        <div id="ocr-overlay"></div>
        <div class="guide" id="guideText">下のボタンを押して住所を撮影してください</div>
    </div>

    <div class="control-panel">
        <button class="btn-main status-shoot" id="actionBtn" onclick="handleAction()">撮影する</button>
    </div>
</div>

<input type="file" id="camera-input" accept="image/*" capture="environment" onchange="onPhotoTaken(event)">

<script>
    // ユーザー様が取得されたYahoo! アプリケーションID
    const YAHOO_APP_ID = 'dmVyPTIwMjUwNyZpZD1SRHh5cndwaVk5Jmhhc2g9WXpaallURTBNMlUyWm1Jek4yWXlaZw';

    const cameraInput = document.getElementById('camera-input');
    const previewImg = document.getElementById('preview-img');
    const overlay = document.getElementById('ocr-overlay');
    const actionBtn = document.getElementById('actionBtn');
    const guideText = document.getElementById('guideText');
    let isShowingResult = false;

    function handleAction() {
        if (!isShowingResult) {
            cameraInput.click();
        } else {
            // 次の撮影へ（初期化）
            isShowingResult = false;
            actionBtn.innerText = "撮影する";
            actionBtn.className = "btn-main status-shoot";
            guideText.innerText = "下のボタンを押して住所を撮影してください";
            
            if (previewImg.src.startsWith('blob:')) {
                URL.revokeObjectURL(previewImg.src);
            }
            previewImg.src = "";
            previewImg.style.display = 'none';
            overlay.innerHTML = '';
            overlay.style.display = 'none';
        }
    }

    function onPhotoTaken(event) {
        const file = event.target.files[0];
        if (!file) return;

        const blobUrl = URL.createObjectURL(file);
        previewImg.src = blobUrl;
        previewImg.style.display = 'block';
        overlay.style.display = 'block';
        
        isShowingResult = true;
        actionBtn.innerText = "次の撮影へ";
        actionBtn.className = "btn-main status-retry";
        guideText.innerText = "文字を解析中...";
        
        cameraInput.value = "";

        // 写真の読み込みが完了したらOCRを実行
        previewImg.onload = () => {
            analyzeImage(file);
        };
    }

    // 画像から文字とその「位置（座標）」を特定する処理
    async function analyzeImage(file) {
        try {
            const worker = await Tesseract.createWorker('jpn');
            const ret = await worker.recognize(file);
            await worker.terminate();

            guideText.innerText = "💡 読めない住所をタップするとルビが出ます";

            const words = ret.data.words;
            
            // 画面上の表示サイズと実際の画像サイズの比率を計算
            const rect = previewImg.getBoundingClientRect();
            const scaleX = rect.width / previewImg.naturalWidth;
            const scaleY = rect.height / previewImg.naturalHeight;
            
            // 画像配置のオフセット（中央寄せによるズレを補正）
            const offsetX = (overlay.offsetWidth - rect.width) / 2;
            const offsetY = (overlay.offsetHeight - rect.height) / 2;

            words.forEach(word => {
                // 漢字が含まれる単語（住所等）にタップボタンを配置
                if (/[\u4E00-\u9FFF]/.test(word.text)) {
                    const btn = document.createElement('div');
                    btn.className = 'kanji-btn';
                    btn.style.left = (word.bbox.x0 * scaleX + offsetX) + 'px';
                    btn.style.top = (word.bbox.y0 * scaleY + offsetY) + 'px';
                    btn.style.width = ((word.bbox.x1 - word.bbox.x0) * scaleX) + 'px';
                    btn.style.height = ((word.bbox.y1 - word.bbox.y0) * scaleY) + 'px';

                    // 住所がタップされたらYahoo! APIを叩く
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        fetchYahooRuby(word.text, e.clientX, e.clientY);
                    };

                    overlay.appendChild(btn);
                }
            });
        } catch (err) {
            guideText.innerText = "解析エラーが発生しました";
            console.error(err);
        }
    }

    // Yahoo! ルビ振りAPIを呼び出してポップアップ表示する処理
    async function fetchYahooRuby(text, clickX, clickY) {
        // すでにあるポップアップを削除
        const oldPopup = overlay.querySelector('.ruby-popup');
        if (oldPopup) oldPopup.remove();

        const popup = document.createElement('div');
        popup.className = 'ruby-popup';
        popup.innerText = "読込中...";
        popup.style.left = clickX + 'px';
        popup.style.top = clickY + 'px';
        overlay.appendChild(popup);

        try {
            // Yahoo!ルビ振りAPI V2の仕様に沿ったリクエスト
            const response = await fetch('https://yahooapis.jp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'User-Agent': `Yahoo AppID: ${YAHOO_APP_ID}`
                },
                body: JSON.stringify({
                    id: "1234-1",
                    jsonrpc: "2.0",
                    method: "jlp.furiganaservice.furigana",
                    params: {
                        q: text,
                        grade: 1 // 全ての漢字にルビを振る設定
                    }
                })
            });

            const data = await response.json();
            
            // Yahoo!から返ってきたデータを解析してひらがなを結合
            if (data.result && data.result.word) {
                let rubyResult = "";
                const wordData = Array.isArray(data.result.word) ? data.result.word : [data.result.word];
                
                wordData.forEach(w => {
                    // ふりがなデータがあればそれを使い、なければ元の文字（ひらがな等）をそのまま結合
                    rubyResult += w.furigana ? w.furigana : w.surface;
                });
                
                popup.innerText = rubyResult;
            } else {
                popup.innerText = "読取不可";
            }
        } catch (err) {
            popup.innerText = "通信エラー";
            console.error(err);
        }
    }
</script>
</body>
</html>
