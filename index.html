<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タップ de ふりがな</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c2331; --indigo: #27386b; --indigo-dark: #1a2750; --mist: #eef1f5; --brand: #27386b; --best-bg: #fffbea;
    --line: #cfd6e0; --paper: #fff; --amber: #f2b705; --muted: #5d6879; --danger: #b3261e;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #e8ecf4; --indigo: #a9bdff; --indigo-dark: #2a3f86; --mist: #0e1424; --brand: #2c409a; --best-bg: #3b3413;
    --line: #33405e; --paper: #182036; --muted: #9fabc2; --danger: #ff8a80;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--mist); color: var(--ink); line-height: 1.6;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  header { background: var(--brand); color: #fff; padding: 12px 16px; }
  .hd-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
  .hd-top span { font-size: 12px; opacity: .75; }
  .hd-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .hist-btn {
    appearance: none; min-height: 40px; padding: 0 16px; border-radius: 20px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .7); background: transparent; color: #fff; font: inherit; font-size: 14px;
  }
  .hist-btn:active { background: rgba(255, 255, 255, .18); }
  .hist-btn.icon { padding: 0 12px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .hist-btn b { background: var(--amber); color: var(--ink); border-radius: 10px; padding: 0 8px; margin-left: 6px; font-size: 12px; }
  .hist-btn:focus-visible, .dr-close:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .scrim {
    position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 32, .45);
    opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s;
  }
  .scrim.on { opacity: 1; visibility: visible; transition: opacity .25s; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(88vw, 380px);
    background: var(--paper); color: var(--ink); display: flex; flex-direction: column; box-shadow: -4px 0 18px rgba(0, 0, 0, .25);
    transform: translateX(100%); visibility: hidden; transition: transform .28s ease, visibility 0s .28s;
  }
  .drawer.on { transform: none; visibility: visible; transition: transform .28s ease; }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
  .dr-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--brand); color: #fff; }
  .dr-head h2 { margin: 0; font-size: 16px; }
  .dr-close {
    appearance: none; background: transparent; color: #fff; font: inherit; font-size: 14px; cursor: pointer;
    min-height: 40px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, .7); border-radius: 20px;
  }
  .dr-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 14px; }
  .h-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .h-time { font-size: 11px; color: var(--muted); }
  .h-rubies { font-size: 20px; font-weight: 700; line-height: 2.1; }
  .h-rubies ruby { margin-right: .4em; }
  .h-rubies rt { font-size: 10px; font-weight: 400; color: var(--indigo); }
  .h-empty { padding: 24px 4px; font-size: 14px; color: var(--muted); }
  .dr-foot { padding: 10px 14px; border-top: 1px solid var(--line); }
  main { max-width: 720px; margin: 0 auto; padding: 14px 14px 40px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  h2 { margin: 0 0 8px; font-size: 15px; }
  .btn {
    appearance: none; border: 1px solid var(--indigo); background: var(--paper); color: var(--indigo);
    font: inherit; font-weight: 700; min-height: 48px; padding: 0 18px; border-radius: 8px; cursor: pointer; width: 100%;
  }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn:active:not(:disabled) { background: var(--indigo-dark); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.small { min-height: 40px; font-size: 14px; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .opt:focus-visible {
    outline: 3px solid var(--amber); outline-offset: 2px;
  }
  .bar { height: 8px; background: var(--mist); border-radius: 4px; overflow: hidden; margin: 12px 0 8px; }
  #barFill { height: 100%; width: 0; background: var(--indigo); transition: width .25s; }
  .msg { margin: 0; font-size: 14px; color: var(--muted); }
  .msg.error { color: var(--danger); font-weight: 700; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  select, input[type="search"] {
    font: inherit; width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 8px;
    padding: 0 10px; background: var(--paper); color: var(--ink);
  }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #thumb { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }

  .list { display: grid; gap: 8px; margin-top: 10px; max-height: 52vh; overflow-y: auto; }
  .opt {
    appearance: none; text-align: left; font: inherit; cursor: pointer; width: 100%;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    display: grid; gap: 0; color: var(--ink); line-height: 1.35;
  }
  .opt .rd { font-size: 12px; color: var(--muted); }
  .opt .kj { font-size: 20px; font-weight: 700; }
  .opt.best { border: 2px solid var(--amber); background: var(--best-bg); }
  .opt:active { background: var(--mist); }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .result { border: 2px solid var(--indigo); }
  .rubies { font-size: 26px; font-weight: 700; line-height: 2.2; }
  .rubies ruby { margin-right: .5em; }
  .rubies rt { font-size: 12px; font-weight: 400; color: var(--indigo); }

  details.debug { margin-top: 18px; }
  details.debug summary { cursor: pointer; font-size: 14px; color: var(--muted); }
  .opts { display: grid; gap: 10px; margin: 12px 0; font-size: 14px; }
  .opts label { display: grid; gap: 4px; }
  .opts .check { display: flex; align-items: center; gap: 8px; }
  .opts .check input { width: 20px; height: 20px; }
  #metrics {
    margin: 0; padding: 10px 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('tapdefurigana.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* 既定のライトモード */ }
})();
</script>
</head>
<body>
<header>
  <div class="hd-top">
    <h1>タップ de ふりがな</h1>
    <span>住所の読み Ver.1 テスト版</span>
    <span id="readyMark" hidden>・準備OK</span>
  </div>
  <div class="hd-actions">
    <button id="themeBtn" class="hist-btn icon" type="button" aria-label="ダークモードに切り替え"><svg id="iconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button id="histBtn" class="hist-btn" type="button" aria-haspopup="dialog" aria-controls="drawer">履歴<b id="histCount">0</b></button>
  </div>
</header>

<main>
  <section class="card" id="loadCard" hidden>
    <p class="msg" id="loadMsg"></p>
    <div class="bar" hidden><div id="barFill"></div></div>
    <button id="loadBtn" class="btn primary" type="button" style="margin-top:10px">もう一度準備する</button>
  </section>

  <section class="card" id="prefCard">
    <label class="lbl" for="pref">都道府県（分かっていれば先に選ぶ）</label>
    <select id="pref" disabled><option value="">準備中…</option></select>
    <div class="row">
      <button id="camBtn" class="btn" type="button" disabled>撮影する</button>
      <button id="galBtn" class="btn" type="button" disabled>ギャラリーから選ぶ</button>
    </div>
    <input id="camIn" type="file" accept="image/*" capture="environment" hidden>
    <input id="galIn" type="file" accept="image/*" hidden>
    <p class="msg" id="status" style="margin-top:10px"></p>
  </section>

  <section class="card" id="photoCard" hidden>
    <canvas id="thumb" width="1" height="1"></canvas>
    <p class="msg" id="photoMsg"></p>
    <button id="retryBtn" class="btn small" type="button" style="margin-top:8px" hidden>準備し直して、もう一度</button>
    <p class="msg" id="ocrText" style="margin-top:6px"></p>
  </section>

  <section class="card" id="cityCard" hidden>
    <h2>① 市区町村を選ぶ</h2>
    <input id="cityQ" type="search" placeholder="絞り込み（漢字またはひらがな）">
    <div class="list" id="cityList"></div>
  </section>

  <section class="card" id="townCard" hidden>
    <h2 id="townHead">② 町域を選ぶ</h2>
    <input id="townQ" type="search" placeholder="絞り込み（漢字またはひらがな）">
    <div class="list" id="townList"></div>
    <p class="note">黄色の枠は、写真の文字にいちばん近い候補です。</p>
    <button id="skipTown" class="btn small" type="button" style="margin-top:10px">町域は選ばずに確定する</button>
  </section>

  <section class="card result" id="result" hidden>
    <h2>読み</h2>
    <div class="rubies" id="rubies"></div>
    <p class="note" style="margin:0 0 10px">この読みは、履歴に自動で残ります。</p>
    <button id="nextBtn" class="btn primary" type="button">次の住所へ</button>
  </section>

  <details class="debug">
    <summary>計測と設定</summary>
    <div class="opts">
      <label>画像サイズの上限（長辺）
        <select id="maxSide">
          <option value="800">800px（軽い）</option>
          <option value="1000">1000px</option>
          <option value="1200" selected>1200px</option>
          <option value="1600">1600px</option>
        </select>
      </label>
      <label>認識モード
        <select id="psm">
          <option value="6" selected>単一ブロック（1〜2行向け・推奨）</option>
          <option value="7">1行のみ</option>
          <option value="3">自動レイアウト</option>
        </select>
      </label>
      <label>OCRエンジンの保持（メモリ対策）
        <select id="keepMode">
          <option value="0" selected>撮影のたびに手放す（メモリ最小・おすすめ）</option>
          <option value="180000">3分間は保持する（連続撮影が速い）</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="normalize" checked>影や明るさのムラを補正して認識</label>
    </div>
    <button id="cleanBtn" class="btn small" type="button" disabled>メモリを整理する</button>
    <pre id="metrics" style="margin-top:12px"></pre>
  </details>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dr-head">
    <h2 id="drawerTitle">履歴（新しい順）</h2>
    <button class="dr-close" id="drawerClose" type="button">閉じる</button>
  </div>
  <div class="dr-body" id="histList"></div>
  <div class="dr-foot"><button class="btn small" id="histClear" type="button">履歴をすべて消す</button></div>
</aside>

<script src="lib/tesseract/tesseract.min.js"></script>
<script src="js/ocr.js"></script>
<script src="js/address.js"></script>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = {
    loadBtn: $('loadBtn'), barFill: $('barFill'), loadMsg: $('loadMsg'), pref: $('pref'),
    camBtn: $('camBtn'), galBtn: $('galBtn'), camIn: $('camIn'), galIn: $('galIn'), status: $('status'),
    photoCard: $('photoCard'), thumb: $('thumb'), ocrText: $('ocrText'),
    cityCard: $('cityCard'), cityQ: $('cityQ'), cityList: $('cityList'),
    townCard: $('townCard'), townHead: $('townHead'), townQ: $('townQ'), townList: $('townList'), skipTown: $('skipTown'),
    result: $('result'), rubies: $('rubies'), nextBtn: $('nextBtn'),
    loadCard: $('loadCard'), retryBtn: $('retryBtn'), prefCard: $('prefCard'), photoMsg: $('photoMsg'), readyMark: $('readyMark'),
    themeBtn: $('themeBtn'), iconSun: $('iconSun'), iconMoon: $('iconMoon'), histBtn: $('histBtn'), histCount: $('histCount'), scrim: $('scrim'), drawer: $('drawer'),
    drawerClose: $('drawerClose'), histList: $('histList'), histClear: $('histClear'),
    maxSide: $('maxSide'), psm: $('psm'), keepMode: $('keepMode'), normalize: $('normalize'), cleanBtn: $('cleanBtn'), metrics: $('metrics'),
  };
  const S = { ready: false, busy: false, prefs: [], prefCode: '', data: null, text: '', city: null, cityEnd: 0, town: null, more: {}, histId: null };
  const metrics = { ocrInit: null, image: null, ocr: null, photos: 0, lastError: '' };
  const nextPaint = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

  // ---------- 表示まわり ----------
  function setProgress(frac, msg) {
    el.barFill.style.width = Math.round(frac * 100) + '%';
    if (msg) { el.loadMsg.textContent = msg; el.loadMsg.classList.remove('error'); }
  }
  function setStatus(msg, isError) {
    // 写真の位置までスクロールしていても見えるよう、写真の下にも同じ文言を出す
    for (const t of [el.status, el.photoMsg]) { t.textContent = msg || ''; t.classList.toggle('error', !!isError); }
  }
  function setBusy(b) {
    S.busy = b;
    el.camBtn.disabled = el.galBtn.disabled = b || !S.ready;
    el.cleanBtn.disabled = b || !S.ready;
  }
  function renderMetrics() {
    const f = (v) => (v == null ? '—' : v >= 1000 ? (v / 1000).toFixed(1) + ' 秒' : v.toFixed(0) + ' ms');
    const heap = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : '（この端末では取得不可）';
    el.metrics.textContent = [
      'OCRエンジン準備: ' + f(metrics.ocrInit),
      '画像の読込・縮小: ' + f(metrics.image),
      'OCR処理        : ' + f(metrics.ocr),
      '撮影した枚数   : ' + metrics.photos,
      '直近のエラー   : ' + (metrics.lastError || 'なし'),
      'OCRエンジン    : ' + (OCR.isLoaded() ? '読み込み中（メモリを使用）' : '手放し済み'),
      'JSメモリ使用   : ' + heap,
    ].join('\n');
  }

  // ---------- 準備（開くと自動で行う） ----------
  // 住所データの一覧を読み込んで使えるようにする。OCRエンジンは重いので、写真を撮るたびに起動し、終わったら手放す
  const OCR_STEPS = ['loading tesseract core', 'initializing tesseract', 'loading language traineddata', 'initializing api'];
  const OCR_LABEL = ['OCRエンジンを読み込み中', 'OCRエンジンを初期化中', '日本語データを読み込み中', 'OCRを準備中'];
  const IDLE_PRELOAD_MS = 120000; // 先読みしたエンジンが使われないとき、手放すまでの時間
  let idleTimer = null;

  async function ensureEngine(quiet) {
    if (OCR.isLoaded()) return;
    const t0 = performance.now();
    if (!quiet) { setStatus('OCRエンジンを準備中…'); await nextPaint(); }
    await OCR.init((m) => {
      const i = OCR_STEPS.indexOf(m.status);
      if (i >= 0 && !quiet) setStatus(OCR_LABEL[i] + '… ' + Math.round(100 * (i + (m.progress || 0)) / OCR_STEPS.length) + '%');
    });
    metrics.ocrInit = performance.now() - t0;
  }
  function scheduleRelease(ms) {
    clearTimeout(idleTimer);
    if (ms > 0) idleTimer = setTimeout(() => { if (!S.busy) OCR.release().then(renderMetrics, () => {}); }, ms);
  }
  const keepMs = () => parseInt(el.keepMode.value, 10) || 0;

  // ページが読み込み直されたか（ブラウザがメモリを空けるために閉じた場合など）を調べる
  let reloaded = !!document.wasDiscarded;
  try {
    if (sessionStorage.getItem('tdf.alive')) reloaded = true;
    sessionStorage.setItem('tdf.alive', '1');
  } catch (e) { /* 調べられない環境では知らせない */ }

  async function prepare() {
    el.loadCard.hidden = true;
    try {
      S.prefs = await Address.loadIndex();
      el.pref.textContent = '';
      el.pref.append(new Option('（都道府県を選ぶ）', ''));
      for (const p of S.prefs) el.pref.append(new Option(p[1] + '（' + p[2] + '）', p[0]));
      el.pref.value = S.prefCode; // 準備し直しても、選んでいた県を保つ
      el.pref.disabled = false;
      S.ready = true;
      setBusy(false);
      el.readyMark.hidden = false;
      setStatus(reloaded
        ? 'ページが読み込み直されたため、自動で準備し直しました（ブラウザがメモリを空けるために閉じた可能性があります）。履歴は残っています。'
        : '準備ができました。都道府県を選ぶか、住所を撮影してください。');
      reloaded = false;
      // 最初の1枚を速くするため、OCRエンジンを裏で先読みする（使われなければ手放す）
      ensureEngine(true).then(() => { scheduleRelease(IDLE_PRELOAD_MS); renderMetrics(); }, () => {});
    } catch (e) {
      console.error(e);
      el.loadMsg.textContent = '準備に失敗しました: ' + (e && e.message ? e.message : e);
      el.loadMsg.classList.add('error');
      el.loadBtn.disabled = false;
      el.loadCard.hidden = false;
    }
    renderMetrics();
  }
  el.loadBtn.addEventListener('click', () => { el.loadBtn.disabled = true; prepare(); });

  // 裏に回っている間はタイマーが止まるため、長く離れていた場合は、戻った時点でエンジンの状態をそろえる
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    const away = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = 0;
    if (!S.busy && OCR.isLoaded() && away > Math.max(keepMs(), IDLE_PRELOAD_MS)) {
      clearTimeout(idleTimer);
      OCR.release().then(renderMetrics, () => {}); // 次の撮影のとき、新しく起動し直す
    }
  });
  el.retryBtn.addEventListener('click', async () => {
    el.retryBtn.hidden = true;
    setStatus('準備し直しています…');
    try { await OCR.release(); } catch (e) { /* 無視 */ }
    await prepare();
    el.prefCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- 都道府県・候補リスト ----------
  async function setPref(code) {
    S.prefCode = code; S.city = null; S.town = null; S.more = {};
    el.cityQ.value = ''; el.townQ.value = '';
    el.townCard.hidden = true; el.result.hidden = true;
    if (!code) { S.data = null; el.cityCard.hidden = true; return; }
    try {
      S.data = await Address.loadPref(code);
    } catch (e) { setStatus(e.message, true); return; }
    el.cityCard.hidden = false;
    renderCities();
  }
  el.pref.addEventListener('change', async () => {
    await setPref(el.pref.value);
    if (S.text && S.data) el.cityCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); // 写真の結果があれば候補へ
  });

  // 候補の並べ方: 絞り込み入力があればそれ、写真があれば近い順（上位のみ）、なければ全件
  function pickRows(all, text, q, more) {
    if (q.trim()) {
      const t = q.trim();
      const hit = all.filter((it) => it[0].includes(t) || it[1].includes(t));
      return { rows: hit.slice(0, 80).map((item) => ({ item })), hidden: Math.max(0, hit.length - 80) };
    }
    if (text) {
      const r = Address.rank(all, text);
      const n = more ? 150 : 6;
      return {
        rows: r.slice(0, n).map((x, i) => ({ item: x.item, end: x.end, best: i === 0 && x.ratio >= 0.6 })),
        hidden: Math.max(0, r.length - n),
      };
    }
    return { rows: all.slice(0, 150).map((item) => ({ item })), hidden: Math.max(0, all.length - 150) };
  }

  function renderRows(box, kind, res, onPick, rerender, keep) {
    const prev = box.scrollTop;
    box.textContent = '';
    for (const row of res.rows) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (row.best ? ' best' : '');
      const rd = document.createElement('span'); rd.className = 'rd'; rd.textContent = row.item[1] || '（読みなし）';
      const kj = document.createElement('span'); kj.className = 'kj'; kj.textContent = row.item[0];
      b.append(rd, kj);
      b.addEventListener('click', () => onPick(row));
      box.append(b);
    }
    if (res.hidden > 0) {
      const m = document.createElement('button');
      m.type = 'button'; m.className = 'btn small';
      m.textContent = S.more[kind] ? '他 ' + res.hidden + ' 件。入力で絞り込んでください' : 'ほかの候補を見る（残り ' + res.hidden + ' 件）';
      m.disabled = !!S.more[kind];
      m.addEventListener('click', () => { S.more[kind] = true; rerender(true); });
      box.append(m);
    }
    box.scrollTop = keep ? prev : 0;
  }

  function renderCities(keep) {
    renderRows(el.cityList, 'city', pickRows(S.data.c, S.text, el.cityQ.value, S.more.city), chooseCity, renderCities, keep);
  }
  el.cityQ.addEventListener('input', () => renderCities());

  function chooseCity(row) {
    S.city = row.item; S.town = null; S.more.town = false; el.townQ.value = '';
    S.cityEnd = row.end != null ? row.end : (S.text ? Address.rank([row.item], S.text)[0].end : 0);
    el.townHead.textContent = '② 町域を選ぶ（' + S.city[0] + '）';
    el.townCard.hidden = false; el.result.hidden = true;
    renderTowns();
    el.townCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderTowns(keep) {
    const rest = S.text.slice(S.cityEnd);
    const text = rest.length ? rest : S.text;
    renderRows(el.townList, 'town', pickRows(S.city[2], text, el.townQ.value, S.more.town), (row) => { S.town = row.item; showResult(); }, renderTowns, keep);
  }
  el.townQ.addEventListener('input', () => renderTowns());
  el.skipTown.addEventListener('click', () => { S.town = null; showResult(); });

  // ---------- 結果 ----------
  function showResult() {
    const pref = S.prefs.find((p) => p[0] === S.prefCode);
    const parts = [[pref[1], pref[2]], [S.city[0], S.city[1]]];
    if (S.town) parts.push([S.town[0], S.town[1]]);
    el.rubies.textContent = '';
    for (const [kj, rd] of parts) {
      const r = document.createElement('ruby');
      r.append(document.createTextNode(kj));
      const rt = document.createElement('rt'); rt.textContent = rd;
      r.append(rt);
      el.rubies.append(r);
    }
    addHistory(parts);
    el.result.hidden = false;
    el.result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  el.nextBtn.addEventListener('click', () => {
    S.text = ''; S.city = null; S.town = null; S.more = {}; S.histId = null;
    el.thumb.width = el.thumb.height = 1; // 写真を手放す
    el.photoCard.hidden = true; el.townCard.hidden = true; el.result.hidden = true;
    el.cityQ.value = ''; el.townQ.value = '';
    setStatus('');
    if (S.data) renderCities();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- 撮影・画像の取り込み ----------
  // カメラやギャラリーを開くと、このページは裏に回る。重いOCRエンジンを抱えたままだと、ブラウザに閉じられやすい
  function releaseBeforePicker() {
    if (keepMs() === 0) { clearTimeout(idleTimer); OCR.release().then(renderMetrics, () => {}); }
  }
  el.camBtn.addEventListener('click', () => { el.camIn.click(); releaseBeforePicker(); });
  el.galBtn.addEventListener('click', () => { el.galIn.click(); releaseBeforePicker(); });
  el.camIn.addEventListener('change', () => handleFile(el.camIn.files[0]));
  el.galIn.addEventListener('change', () => handleFile(el.galIn.files[0]));

  // 読み込み時点で縮小して、元の大きな写真を丸ごとメモリに展開しないようにする
  async function loadBitmap(file, maxSide) {
    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image', resizeWidth: maxSide, resizeQuality: 'medium' }); } catch (e) { /* 次の方法へ */ }
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 次の方法へ */ }
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.src = url;
    });
  }

  async function handleFile(file) {
    if (!file || S.busy) return;
    setBusy(true);
    el.thumb.width = el.thumb.height = 1; // 前の写真を先に手放す
    S.text = ''; S.city = null; S.town = null; S.more = {}; S.histId = null;
    el.townCard.hidden = true; el.result.hidden = true; el.cityQ.value = '';
    clearTimeout(idleTimer);
    el.retryBtn.hidden = true;
    let work = null;
    try {
      setStatus('画像を読み込み中…');
      await nextPaint();
      const tImg = performance.now();
      const maxSide = parseInt(el.maxSide.value, 10);
      const bmp = await loadBitmap(file, maxSide);
      const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      work = document.createElement('canvas');
      work.width = w; work.height = h;
      work.getContext('2d').drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      const tw = Math.min(w, 600);
      el.thumb.width = tw; el.thumb.height = Math.round(h * tw / w);
      el.thumb.getContext('2d').drawImage(work, 0, 0, el.thumb.width, el.thumb.height);
      el.photoCard.hidden = false;
      el.photoCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); // 撮影した写真の位置へ
      metrics.image = performance.now() - tImg;

      await ensureEngine(false); // 手放してあれば、ここで起動する
      setStatus('文字を解析中… 0%');
      await nextPaint();
      const tOcr = performance.now();
      const lines = await OCR.recognize(work, { psm: el.psm.value, normalize: el.normalize.checked }, (m) => {
        if (m.status === 'recognizing text') setStatus('文字を解析中… ' + Math.round((m.progress || 0) * 100) + '%');
      });
      metrics.ocr = performance.now() - tOcr;
      metrics.photos++;
      // 読み取りが終わったら、エンジンを手放す（設定で、しばらく保持することもできる）
      if (keepMs() === 0) OCR.release().then(renderMetrics, () => {}); else scheduleRelease(keepMs());

      const raw = lines.map((l) => l.text).join('');
      S.text = Address.normalizeText(raw);
      el.ocrText.textContent = S.text ? '読み取った文字: ' + raw : '文字を読み取れませんでした。住所だけが大きく写るように撮り直してください。';
      if (!S.text) { setStatus(''); return; }

      if (!S.prefCode) {
        const code = Address.detectPref(S.prefs, S.text);
        if (code) { el.pref.value = code; await setPref(code); }
      }
      if (!S.prefCode) {
        setStatus('都道府県を読み取れませんでした。上の欄で都道府県を選んでください。', true);
        el.prefCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        setStatus('候補を出しました。黄色の枠が、写真の文字にいちばん近い候補です。');
        el.cityCard.hidden = false;
        renderCities();
        el.cityCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } catch (e) {
      console.error(e);
      metrics.lastError = (e && (e.message || e.name)) ? String(e.message || e.name) : String(e);
      setStatus('処理に失敗しました: ' + metrics.lastError + '（メモリ不足の可能性もあります）。自動で整理しています。少し待って、もう一度試してください。', true);
      OCR.release().catch(() => {});
      el.retryBtn.hidden = false; // 失敗した場所に、やり直しの入口を出す
    } finally {
      if (work) { work.width = work.height = 0; } // 作業用の画像を手放す
      el.camIn.value = ''; el.galIn.value = '';
      setBusy(false);
      renderMetrics();
    }
  }

  // ---------- 履歴（読みが決まると自動で残る。ブラウザ内にだけ保存） ----------
  const HKEY = 'tapdefurigana.history.v1';
  const HMAX = 200;
  let hist = [];
  function loadHist() {
    try { const j = JSON.parse(localStorage.getItem(HKEY) || '[]'); hist = Array.isArray(j) ? j : []; } catch (e) { hist = []; }
  }
  function saveHist() {
    try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) { /* 保存できない環境でも動作は続ける */ }
  }
  // 同じ住所を選び直したときは、前の記録を置き換える（誤って選んだ候補が履歴に残らないように）
  function addHistory(parts) {
    const key = parts.map((p) => p[0]).join('|');
    hist = hist.filter((h) => h.id !== S.histId && h.k !== key);
    const entry = { id: Date.now(), k: key, p: parts, t: Date.now() };
    hist.unshift(entry);
    if (hist.length > HMAX) hist.length = HMAX;
    S.histId = entry.id;
    saveHist();
    renderHist();
  }
  function renderHist() {
    el.histCount.textContent = hist.length;
    el.histList.textContent = '';
    if (!hist.length) {
      const p = document.createElement('p');
      p.className = 'h-empty';
      p.textContent = 'まだ履歴はありません。住所の読みを決めると、ここに自動で残ります。';
      el.histList.append(p);
      return;
    }
    for (const h of hist) {
      const item = document.createElement('div');
      item.className = 'h-item';
      const d = new Date(h.t);
      const time = document.createElement('div');
      time.className = 'h-time';
      time.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      const rb = document.createElement('div');
      rb.className = 'h-rubies';
      for (const [kj, rd] of h.p) {
        const r = document.createElement('ruby');
        r.append(document.createTextNode(kj));
        const rt = document.createElement('rt'); rt.textContent = rd;
        r.append(rt);
        rb.append(r);
      }
      item.append(time, rb);
      el.histList.append(item);
    }
  }
  let lastFocus = null;
  function openDrawer() {
    lastFocus = document.activeElement;
    el.drawer.classList.add('on'); el.scrim.classList.add('on');
    el.drawer.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    el.histList.scrollTop = 0;
    el.drawerClose.focus();
  }
  function closeDrawer() {
    el.drawer.classList.remove('on'); el.scrim.classList.remove('on');
    el.drawer.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  el.histBtn.addEventListener('click', openDrawer);
  el.drawerClose.addEventListener('click', closeDrawer);
  el.scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && el.drawer.classList.contains('on')) closeDrawer(); });
  el.histClear.addEventListener('click', () => {
    if (hist.length && confirm('履歴をすべて消します。よろしいですか？')) { hist = []; saveHist(); renderHist(); }
  });

  // ---------- ライト／ダーク ----------
  function applyTheme(t, save) {
    document.documentElement.setAttribute('data-theme', t);
    // 今のモードの印を出す（ライト＝太陽、ダーク＝月）。SVGにはhiddenプロパティがないので属性で切り替える
    el.iconSun.toggleAttribute('hidden', t === 'dark');
    el.iconMoon.toggleAttribute('hidden', t !== 'dark');
    el.themeBtn.setAttribute('aria-label', t === 'dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
    if (save) { try { localStorage.setItem('tapdefurigana.theme', t); } catch (e) { /* 保存できなくても切り替えは有効 */ } }
  }
  el.themeBtn.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

  // ---------- メモリを整理 ----------
  el.cleanBtn.addEventListener('click', async () => {
    setBusy(true);
    setStatus('メモリを整理中…');
    el.thumb.width = el.thumb.height = 1;
    try { await OCR.release(); setStatus('メモリを整理しました。'); }
    catch (e) { setStatus('整理に失敗しました。ページを再読み込みしてください。', true); }
    setBusy(false);
    renderMetrics();
  });

  loadHist();
  renderHist();
  renderMetrics();
  if (typeof Tesseract === 'undefined') {
    el.loadCard.hidden = false;
    el.loadBtn.disabled = true;
    el.loadMsg.textContent = 'lib/ フォルダにライブラリがありません。README.md の手順を確認してください。';
    el.loadMsg.classList.add('error');
  } else {
    prepare();
  }
})();
</script>
</body>
</html>
